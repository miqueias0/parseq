# @package _global_
defaults:
  - override /model: alpr_parseq
  - override /charset: alpr

model:
  name: alpr-48x96-mobilenetv3-cnn-only
  img_size: [ 48, 96 ]
  embed_dim: 256
  num_cnn_stages: 4
  num_vit_layers: 0  # CNN-Only (M=0)
  backbone_type: mobilenetv3
  enc_num_heads: 4
  dec_num_heads: 8
  max_label_length: 7
  refine_iters: 0
