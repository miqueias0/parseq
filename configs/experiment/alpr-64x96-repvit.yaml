# @package _global_
defaults:
  - override /model: alpr_parseq
  - override /charset: alpr

model:
  name: alpr-64x96-repvit
  img_size: [ 64, 96 ]
  embed_dim: 192
  num_cnn_stages: 2
  num_vit_layers: 6
  backbone_type: repvit
  enc_num_heads: 3
  dec_num_heads: 6
  max_label_length: 7
  refine_iters: 0
