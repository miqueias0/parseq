name: parseq-cnn-repvgg-embed256
_target_: strhub.models.parseq_hybrid.system.PARSeq

# Data & Geometry
patch_size: [ 4, 8 ]

# CNN Backbone (RepVGG)
backbone: repvgg_a0
pretrained_backbone: false
dw_stride: [ 1, 2 ]
pos_embed_type: learned

# Architecture
embed_dim: 256
enc_num_heads: 4
enc_mlp_ratio: 3
enc_depth: 0          # Pure CNN
dec_num_heads: 8
dec_mlp_ratio: 3
dec_depth: 1

# Training
lr: 6e-4
weight_decay: 1e-4
perm_num: 4
perm_forward: true
perm_mirrored: true
perm_forward_weight: 2.0
label_smoothing: 0.05
dropout: 0.1

# Decoding mode (inference)
decode_ar: false
refine_iters: 1
