name: parseq-distill
_target_: strhub.models.parseq.distill_system.PARSeqDistill

# Hiperparâmetros de Destilação (sviptr-distill)
# Professor: SEMPRE configs/model/parseq.yaml
teacher_ckpt: null             # Caminho para checkpoint do professor (.ckpt ou .pth) ou 'pretrained=parseq'
alpha: 0.5                     # 0.0 = só rótulo real (CE), 1.0 = só destilação (KD)
temperature: 2.0               # Temperatura de suavização de softmax (Hinton KD)
use_teacher_conf: true         # Ponderar por confiança do professor em cada placa
distill_mode: perms            # perms (todas as permutações), nar (apenas paralelo), ou both
teacher_img_size: [ 32, 128 ]  # Resolução esperada pelo professor (redimensiona via interpolação se aluno for diferente)

# Arquitetura Padrão do Aluno (pode ser sobrescrita pelo Hydra via +experiment ou model/...)
patch_size: [ 6, 8 ]
embed_dim: 192
enc_num_heads: 6
enc_mlp_ratio: 3
enc_depth: 6
dec_num_heads: 6
dec_mlp_ratio: 3
dec_depth: 1

# Treinamento do Aluno
lr: 9e-4
weight_decay: 1e-4
perm_num: 4
perm_forward: true
perm_mirrored: true
perm_forward_weight: 2.0
label_smoothing: 0.05
dropout: 0.1

# Modo de Decodificação (Inferência)
decode_ar: false
refine_iters: 1
