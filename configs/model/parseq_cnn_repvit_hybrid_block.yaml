name: parseq-cnn-repvit-hybrid-block
_target_: strhub.models.parseq_hybrid.system.PARSeq

# Data & Geometry
patch_size: [ 4, 8 ]
# Hiperparâmetros de Destilação (sviptr-distill)
# Professor: SEMPRE configs/model/parseq.yaml
teacher_ckpt: null             # Caminho para checkpoint do professor (.ckpt ou .pth) ou 'pretrained=parseq'
alpha: 0.3                     # 0.0 = só rótulo real (CE), 1.0 = só destilação (KD)
temperature: 1.5               # Temperatura de suavização de softmax (Hinton KD)
use_teacher_conf: true         # Ponderar por confiança do professor em cada placa
distill_mode: perms            # perms (todas as permutações), nar (apenas paralelo), ou both
teacher_img_size: [ 32, 128 ]  # Resolução esperada pelo professor (redimensiona via interpolação se aluno for diferente)
# CNN Backbone + 4 Hybrid Blocks (DWConv local mixing + MHSA global mixing)
backbone: repvit_m0_9
pretrained_backbone: true
dw_stride: [ 1, 2 ]
pos_embed_type: learned
block_type: hybrid     # HybridBlock: Convolução Depthwise + Self-Attention no mesmo bloco

# Architecture
embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 4
enc_depth: 4          # 4 blocos híbridos
dec_num_heads: 12
dec_mlp_ratio: 4
dec_depth: 1          # 1 layer decoder

# Training
lr: 5e-4
weight_decay: 1e-4
perm_num: 4
perm_forward: true
perm_mirrored: true
perm_forward_weight: 2.0
label_smoothing: 0.05
dropout: 0.1

# Decoding mode (inference)
decode_ar: true
refine_iters: 1
