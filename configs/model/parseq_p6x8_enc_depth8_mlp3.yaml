# 3-Var: patch_size [6, 8] + enc_depth 8 + mlp 3
name: parseq-p6x8-enc-depth8-mlp3
_target_: strhub.models.parseq.system.PARSeq

# Data
patch_size: [6, 8]

# Architecture
embed_dim: 384
enc_num_heads: 6
enc_mlp_ratio: 3
enc_depth: 8
dec_num_heads: 12
dec_mlp_ratio: 3
dec_depth: 1

# Training
lr: 0.00045
weight_decay: 0.001
perm_num: 4
perm_forward: true
perm_mirrored: true
dropout: 0.15

# Decoding mode (test)
decode_ar: false
refine_iters: 1
