defaults:
  - _self_
  - model: parseq
  - charset: 36_alpr
  - dataset: VeSV_pad

model:
  _convert_: all
  img_size: [ 32, 128 ]  # [ height, width ]
  max_label_length: 7
  # The ordering in charset_train matters. It determines the token IDs assigned to each character.
  charset_train: ???
  # For charset_test, ordering doesn't matter.
  charset_test: "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  batch_size: 128
  weight_decay: 1e-4
  warmup_pct: 0.075  # equivalent to 1.5 epochs of warm up
  label_smoothing: 0.05
  perm_forward_weight: 2.0
  cnn_depth: 0

data:
  _target_: strhub.data.module.SceneTextDataModule
  root_dir: data
  train_dir: ???
  batch_size: ${model.batch_size}
  img_size: ${model.img_size}
  charset_train: ${model.charset_train}
  charset_test: ${model.charset_test}
  max_label_length: ${model.max_label_length}
  remove_whitespace: true
  normalize_unicode: true
  augment: true
  num_workers: 8

trainer:
  _target_: pytorch_lightning.Trainer
  _convert_: all
  val_check_interval: 50
  max_steps: -1
  max_epochs: 100
  gradient_clip_val: 20
  accelerator: gpu
  devices: -1

ckpt_path: null
pretrained: null
quantize: jetfire_fqt  # Optional: 'qat' or 'jetfire_fqt' for INT8 fine-tuning
quant_block_size: 64

# Experiment & Dataset tracking tags
dataset: ${data.train_dir}
experiment_name: ${oc.select:experiment,default}

hydra:
  output_subdir: config
  run:
    dir: outputs/${model.name}/${dataset}/${experiment_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: multirun/${model.name}/${dataset}/${experiment_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
